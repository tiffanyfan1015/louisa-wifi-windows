name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./scripts/build-windows.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: LouisaWifi-windows-x64
          path: artifacts/win-x64/
